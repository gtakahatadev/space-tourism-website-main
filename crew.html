<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/favicon-32x32.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow&family=Barlow+Condensed&family=Bellefair&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/reset.css" class="css" />
    <link rel="stylesheet" href="./css/global.css" class="css" />
    <link rel="stylesheet" href="./css/root.css" class="css" />
    <link rel="stylesheet" href="./css/crew.css" class="css" />

    <title>Frontend Mentor | Space tourism website</title>
  </head>
  <body>
    <nav class="menu">
      <img
        class="menu__logo"
        src="./assets/shared/logo.svg"
        alt="Space tourism logo"
      />
      <div class="menu__line"></div>
      <button
        type="button"
        class="menu__toggle"
        id="menuToggle"
        aria-expanded="false"
        aria-controls="menuNavbar"
        aria-label="Abrir menu"
      >
        <img
          class="menu__toggle-icon"
          id="menuToggleIcon"
          src="./assets/shared/icon-hamburger.svg"
          alt=""
        />
      </button>
      <ul class="menu__navbar" id="menuNavbar">
        <li class="navbar__item"><a href="./index.html">00 HOME</a></li>
        <li class="navbar__item">
          <a href="./destination.html">01 DESTINATION</a>
        </li>
        <li class="navbar__item">
          <a href="./crew.html">02 CREW</a>
        </li>
        <li class="navbar__item">
          <a href="./technology.html">03 TECHNOLOGY</a>
        </li>
      </ul>
    </nav>
    <main class="container__crew">
      <span class="crew__heading">
        <p class="heading__label1">02</p>
        <p class="heading__label">MEET YOUR CREW</p>
      </span>
      <!-- caixa do lado esquerdo -->
      <picture class="crew">
        <img
          id="crew-img"
          src="assets/crew/image-douglas-hurley.png"
          alt="Comandante Douglas Hurley"
        />
      </picture>
      <!-- caixa do lado direito -->
      <div class="crew__content">
        <nav class="crew__tabs" aria-label="crew">
          <button
            id="commander"
            class="tabs_item"
            type="button"
            data-crew="commander"
            role="tab"
            aria-selected="true"
          ></button>
          <button
            id="specialist"
            class="tabs_item"
            type="button"
            data-crew="specialist"
            role="tab"
            aria-selected="false"
          ></button>
          <button
            id="pilot"
            class="tabs_item"
            type="button"
            data-crew="pilot"
            role="tab"
            aria-selected="false"
          ></button>
          <button
            id="engineer"
            class="tabs_item"
            type="button"
            data-crew="engineer"
            role="tab"
            aria-selected="false"
          ></button>
        </nav>
        <h3 id="crew-role" class="crew__role">COMMANDER</h3>
        <h2 id="crew-name" class="crew__name">DOUGLAS HURLEY</h2>
        <p id="crew-description" class="crew__description">
          Douglas Gerald Hurley is an American engineer, former Marine Corps
          pilot and former NASA astronaut. He launched into space for the third
          time as commander of Crew Dragon Demo-2.
        </p>
      </div>
    </main>
    <script src="./js/menu.js"></script>
    <script src="js/crew.js"></script>
  </body>
</html>
